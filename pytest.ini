[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers --tb=short

markers =
    given: the physics library — passes on day one, proves uavsense works
    week02: SimConfig — the configuration model
    week03: the engine — snapshots, caching, cost estimation
    week09: presets — save, load, built-in library
    week11: export — CSV, PNG, bundles

filterwarnings =
    ignore::DeprecationWarning
